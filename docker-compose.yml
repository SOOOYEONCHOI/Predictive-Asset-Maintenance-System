services:
  pm-api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    command: uvicorn pm_api.main:app --host 0.0.0.0 --port 8000

  agent-api:
    build: ./backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend/agent:/app/agent
      - ./backend/data:/app/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PM_API_BASE=http://pm-api:8000
      - MONITORING_BACKEND=${MONITORING_BACKEND}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
    depends_on:
      - pm-api
    command: uvicorn agent.main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8001
    depends_on:
      - agent-api
    command: npm run dev -- --host